name: Daily DAU to Discord

on:
  schedule:
    # 04:30 UTC = 10:00 IST every day
    - cron: "30 4 * * *"
  workflow_dispatch: # adds a "Run workflow" button for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-analytics-data

      - name: Post DAU to Discord
        run: python scripts/dau_notifier.py
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_NAME: WeBuddhist
          # Uncomment to report only the iOS app (matches the iOS view in your screenshot):
          # PLATFORM: iOS
