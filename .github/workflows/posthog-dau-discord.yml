name: Daily report → Discord

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day. Reports on the previous day (UTC, 5:30 AM to 5:30 AM IST).
    - cron: "30 3 * * *"
  workflow_dispatch: # manual runs post to the test channel
    inputs:
      date:
        description: "Day to report on, YYYY-MM-DD. Leave empty for yesterday."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # passed on to report.yml for the keyless Google Cloud sign-in

jobs:
  daily:
    uses: ./.github/workflows/report.yml
    with:
      report: daily
      date: ${{ inputs.date || '' }}
    secrets: inherit
